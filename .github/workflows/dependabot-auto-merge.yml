name: Dependabot auto-merge

# Individual npm patch/minor updates and eligible non-npm updates may auto-merge.
# Grouped npm updates require compatibility review in separate lanes, even when CI passes.
# Read this policy from the protected base branch. Never check out or execute PR code.
# Metadata contract: https://github.com/dependabot/fetch-metadata#usage

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Auto-approve + enable eligible patch/minor auto-merge
        if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          steps.meta.outputs.dependency-names != '' &&
          steps.meta.outputs.package-ecosystem != '' &&
          !(
            (steps.meta.outputs.package-ecosystem == 'npm' ||
             steps.meta.outputs.package-ecosystem == 'npm_and_yarn' ||
             startsWith(github.head_ref, 'dependabot/npm_and_yarn/')) &&
            (steps.meta.outputs.dependency-group != '' ||
             contains(steps.meta.outputs.dependency-names, ','))
          )
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

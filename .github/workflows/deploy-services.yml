name: Deploy services

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        default: changed
        type: choice
        options:
          - changed
          - log-node
          - graph-node
          - directory-node
          - archive-node
          - all

concurrency: deploy-services-${{ github.event.workflow_run.head_sha || github.sha }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      log_node: ${{ steps.changed.outputs.log_node }}
      graph_node: ${{ steps.changed.outputs.graph_node }}
      directory_node: ${{ steps.changed.outputs.directory_node }}
      archive_node: ${{ steps.changed.outputs.archive_node }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - id: changed
        name: Detect changed services
        shell: bash
        env:
          SERVICE: ${{ inputs.service || 'changed' }}
        run: |
          set -euo pipefail

          log_node=false
          graph_node=false
          directory_node=false
          archive_node=false

          case "$SERVICE" in
            all)
              log_node=true
              graph_node=true
              directory_node=true
              archive_node=true
              ;;
            log-node)
              log_node=true
              ;;
            graph-node)
              graph_node=true
              ;;
            directory-node)
              directory_node=true
              ;;
            archive-node)
              archive_node=true
              ;;
            changed)
              if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                changed_files="$(git diff --name-only HEAD^ HEAD)"
              else
                changed_files="$(git show --name-only --format= HEAD)"
              fi

              while IFS= read -r path; do
                case "$path" in
                  .dockerignore)
                    log_node=true
                    graph_node=true
                    directory_node=true
                    archive_node=true
                    ;;
                  services/log-node/*|apps/dashboard/*)
                    log_node=true
                    ;;
                  services/graph-node/*)
                    graph_node=true
                    ;;
                  services/directory-node/*)
                    directory_node=true
                    ;;
                  services/archive-node/*|spec/conformance/2.12/*)
                    archive_node=true
                    ;;
                  packages/mcp/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig.base.json)
                    log_node=true
                    graph_node=true
                    directory_node=true
                    archive_node=true
                    ;;
                  packages/directory/*)
                    log_node=true
                    directory_node=true
                    ;;
                  packages/verify/*)
                    graph_node=true
                    archive_node=true
                    ;;
                esac
              done <<< "$changed_files"
              ;;
            *)
              echo "Unknown service: $SERVICE" >&2
              exit 1
              ;;
          esac

          {
            echo "log_node=$log_node"
            echo "graph_node=$graph_node"
            echo "directory_node=$directory_node"
            echo "archive_node=$archive_node"
          } >> "$GITHUB_OUTPUT"

          echo "log-node=$log_node"
          echo "graph-node=$graph_node"
          echo "directory-node=$directory_node"
          echo "archive-node=$archive_node"

  deploy-log-node:
    needs: changes
    if: needs.changes.outputs.log_node == 'true'
    runs-on: ubuntu-latest
    # See the note on deploy-graph-node for why every deploy job carries its own
    # concurrency group.
    concurrency:
      group: deploy-log-node
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy log-node
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -c services/log-node/fly.toml --remote-only

  # Split out of deploy-log-node so that job's result means "the deploy failed"
  # and nothing else. Other jobs gate on it: while the smoke check lived inside
  # deploy-log-node, any post-deploy failure turned the whole job red and took
  # them with it. On 2026-07-29 a favicon-parity mismatch between the marketing
  # site and the explorer's static assets, nothing to do with log-node, failed
  # this check after a successful deploy and suppressed the graph canary for a
  # graph-node release that had shipped fine (run 30437471595).
  #
  # Same reasoning that moved the graph canary out of this job: a gate should
  # fail for its own reason, not inherit someone else's.
  #
  # That isolation matters because part of this check is not under this repo's
  # control and cannot be forced green on demand. The asset parity section
  # compares live bytes across two independently deployed origins: atrib.dev
  # (Vercel, from the atrib-web repo) against explore.atrib.dev (Fly, serving
  # apps/dashboard from here). An icon change is therefore red between the two
  # deploys, and the lag is asymmetric: atrib.dev serves
  # `max-age=0, must-revalidate` and picks up new bytes promptly, while the
  # explorer's /static/* paths serve `max-age=86400, immutable`, so a CDN can
  # keep returning the old bytes there until the TTL expires. That is the shape
  # the 2026-07-29 failure had, marketing already on the new hash while
  # explorer-static was still on the old one. It ran about 24 hours and cleared
  # on its own with no purge, at `age: 0`.
  #
  # The check itself is sound and asserts nothing about cache policy. An earlier
  # version of this comment claimed it called requireImmutableCache; it does
  # not. That helper is applied only to Merkle-log tiles (lines ~187-188), which
  # are immutable by construction. Do not reintroduce that reading.
  #
  # This is a per-icon-change cost, not a standing fault: the assets went
  # unchanged from 2026-05-26, when the parity check landed, to 2026-07-29, and
  # it passed throughout. Removing the window would be a small change (shorter
  # TTL on these paths, or asserting on the hashed filenames rather than the
  # stable ones), not a redesign. Until then the gate has to be able to fail
  # without taking other jobs with it.
  log-smoke:
    needs: [changes, deploy-log-node]
    # !cancelled() rather than relying on the default cascade, so the guards
    # below are the only thing deciding. Runs only for a log-node release whose
    # deploy actually succeeded: smoke-testing a failed deploy restates the
    # failure.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.changes.outputs.log_node == 'true'
      && needs.deploy-log-node.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # No pnpm install or workspace build: check-log-smoke.mjs imports only
      # node:crypto.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Smoke test public log endpoints
        shell: bash
        run: node .github/scripts/check-log-smoke.mjs

  deploy-graph-node:
    needs: changes
    if: needs.changes.outputs.graph_node == 'true'
    runs-on: ubuntu-latest
    # Serialize deploys of THIS service across commits.
    #
    # The workflow-level `concurrency` above is keyed per head_sha, which puts
    # every commit in its own group and so serializes nothing: two runs from
    # different commits can both reach `flyctl deploy` against the same Fly app,
    # and a slower deploy of an older commit can land after a newer one and
    # quietly roll production back. Commits land close together here (four
    # merges inside twenty minutes on 2026-07-29), so it is reachable.
    #
    # The group is per JOB, not workflow-wide. A single workflow-wide group
    # would be wrong: GitHub cancels the previously pending run when a new one
    # queues, and because change detection is per-commit (git diff HEAD^ HEAD),
    # cancelling commit A's run drops A's graph-node deploy entirely if commit B
    # only touched log-node. Per-job, only runs that actually deploy this
    # service contend, and the survivor is always the newest, whose tree already
    # contains the older change.
    #
    # cancel-in-progress stays false: a deploy that is already applying should
    # finish rather than be killed part-way.
    concurrency:
      group: deploy-graph-node
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy graph-node
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -c services/graph-node/fly.toml --remote-only

  # The log-to-graph indexing canary runs in its own job so it starts AFTER
  # both deploys settle rather than alongside them.
  #
  # It used to be the last step of deploy-log-node, which depends only on
  # `changes`, so deploy-log-node and deploy-graph-node ran in parallel with no
  # ordering. A commit touching a shared path (packages/mcp/*, package.json,
  # pnpm-lock.yaml, pnpm-workspace.yaml, tsconfig.base.json, .dockerignore)
  # sets both flags, and the canary could then poll graph-node while its
  # machine was restarting into the new release. graph-node replays its whole
  # record archive on start, so that window serves 502s and the canary fails on
  # a system that is actually fine.
  #
  # It now also runs when only graph-node deployed. The canary exercises log
  # submit through graph index, so a graph-node-only release is exactly the
  # change it should gate; previously it ran on log-node releases only, which
  # is why the 2026-07-29 trace regression shipped without the canary seeing it.
  graph-canary:
    needs: [changes, deploy-log-node, deploy-graph-node]
    # !cancelled() keeps a skipped sibling deploy from skipping this job, since
    # a skipped `needs` entry otherwise cascades, while still standing down when
    # the run itself is cancelled. The guards then re-impose the real
    # conditions: `changes` actually ran, at least one of the two services
    # deployed, and neither deploy failed or was cancelled (a red canary after a
    # failed deploy would only restate the deploy failure).
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && (needs.changes.outputs.log_node == 'true' || needs.changes.outputs.graph_node == 'true')
      && needs.deploy-log-node.result != 'failure'
      && needs.deploy-graph-node.result != 'failure'
      && needs.deploy-log-node.result != 'cancelled'
      && needs.deploy-graph-node.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # Runs before the install: it has no dependencies, and it fails in
      # seconds with a specific message when graph-node is wedged, where the
      # canary below would spend its whole 90s deadline discovering the same
      # thing less clearly.
      - name: Smoke test graph-node stats and heap headroom
        shell: bash
        run: node .github/scripts/check-graph-smoke.mjs

      - name: Install canary dependencies
        run: pnpm install --frozen-lockfile

      - name: Build canary dependencies
        run: pnpm --filter @atrib/mcp build

      - name: Smoke test log to graph indexing
        env:
          ATRIB_GRAPH_CANARY_KEY: ${{ secrets.ATRIB_GRAPH_CANARY_KEY }}
        run: pnpm --filter @atrib/log-node graph-canary

  deploy-directory-node:
    needs: changes
    if: needs.changes.outputs.directory_node == 'true'
    runs-on: ubuntu-latest
    # Per-job group, same reasoning as deploy-graph-node above.
    concurrency:
      group: deploy-directory-node
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy directory-node
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -c services/directory-node/fly.toml --remote-only

  deploy-archive-node:
    needs: changes
    if: needs.changes.outputs.archive_node == 'true'
    runs-on: ubuntu-latest
    # Per-job group, same reasoning as deploy-graph-node above.
    concurrency:
      group: deploy-archive-node
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install archive dependencies
        run: pnpm install --frozen-lockfile

      - name: Build archive dependencies
        run: |
          pnpm --filter @atrib/mcp build
          pnpm --filter @atrib/verify build
          pnpm --filter @atrib/archive-node build

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy archive-node
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy -c services/archive-node/fly.toml --remote-only

      - name: Smoke test archive retention manifest
        shell: bash
        run: |
          set -euo pipefail
          archive_smoke_url="${ATRIB_ARCHIVE_SMOKE_URL:-https://atrib-archive.fly.dev/v1/retention}"
          curl -fsS "$archive_smoke_url" > /tmp/archive-retention.json
          node -e "const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('/tmp/archive-retention.json','utf8')); if (body.operator !== 'archive.atrib.dev') throw new Error('unexpected archive operator'); if (typeof body.minimum_window_ms !== 'number') throw new Error('missing minimum_window_ms');"

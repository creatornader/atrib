app = 'atrib-graph'
primary_region = 'iad'

[build]
  dockerfile = '../../services/graph-node/Dockerfile'

[env]
  PORT = '3200'
  HOST = '0.0.0.0'
  # Node caps its old-space heap at roughly half of a small machine's RAM,
  # independent of what [[vm]] memory says. On this 1024mb machine V8 reported
  # heap_size_limit = 493MB, so the 2026-05-06 bump from 256mb never reached
  # the heap that was actually running out: on 2026-07-29 the resident record
  # set (~112k records, ~450MB) filled that 493MB ceiling and any further
  # allocation aborted the process with "Ineffective mark-compacts near heap
  # limit". This makes the RAM the machine already has usable. Leaves ~200MB
  # for non-heap RSS (node binary, buffers, archive replay stream).
  NODE_OPTIONS = '--max-old-space-size=768'
  # Append-only archive of every successful /v1/ingest. Replayed on
  # cold-start so graph-node rebuilds its in-memory store after OOM /
  # deploy / fly machine reboot. Mounts on the [mounts] volume below.
  # See services/graph-node/src/persistence.ts for format + crash
  # semantics.
  ATRIB_RECORD_ARCHIVE = '/data/records.jsonl'

[[mounts]]
  source = 'atrib_graph_data'
  destination = '/data'

[http_service]
  internal_port = 3200
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

# Liveness. Until 2026-07-29 this service had no health check at all, so when
# the process entered a crash loop Fly had no signal: it kept routing to a dead
# instance and returning 502s, and the only thing that noticed was a post-deploy
# canary in another job.
#
# timeout is deliberately far above the ~0.15s a healthy /v1/stats takes. The
# failure mode worth catching is a wedged process, not a slow one: during the
# outage the event loop was spending ~65-75% of wall-clock in GC and requests
# took 17-25s while the process was still listening. 10s separates that from
# ordinary GC jitter without flapping.
#
# grace_period MUST exceed archive replay. main.ts replays the whole record
# archive BEFORE binding the port, so nothing is listening until it finishes:
# ~5s at 112k records, and replay time grows linearly with record count.
#
# 60s is the ceiling, not a preference. Fly silently clamps this value to one
# minute ("grace period greater than 1 minute; this will be lowered to 1
# minute" from `flyctl config validate`), so asking for more is a no-op that
# reads as protection you do not have.
#
# That clamp is a real bound on this service's design, not just on this file.
# At the measured ~20.6k records/sec replay rate, 60s of grace covers about
# 1.24M records. Machine sizing hits it before it hits a memory wall:
#
#   1GB   214k records    ~10s replay
#   2GB   427k records    ~21s replay
#   4GB   854k records    ~41s replay
#   8GB   1.7M records    ~83s replay   <- exceeds the 60s cap
#
# So "keep raising memory" stops working somewhere past the 4GB tier, for
# startup reasons rather than heap reasons. Recorded in P059.
[[http_service.checks]]
  interval = '30s'
  timeout = '10s'
  grace_period = '60s'
  method = 'GET'
  path = '/v1/stats'

[[vm]]
  size = 'shared-cpu-1x'
  # Bumped from 256mb after observed OOM-kill on 2026-05-06 with ~1500 records
  # in-memory. graph-node holds all derived edges + per-record verification
  # state in memory, so memory pressure scales with log size. Raising this
  # alone is not enough: see NODE_OPTIONS above, V8 will not use the extra RAM
  # unless told. Both settings move together.
  #
  # Headroom is finite and the log only grows (~4k to 7k records/day at
  # 2026-07-29, ~3.4KB each in heap, so ~15-22MB/day). At a 768MB heap that is
  # weeks, not quarters. The durable fix is the disk-backed graph store already
  # flagged in src/persistence.ts, which notes this in-memory shape is
  # sustainable to ~10^5 records; the log passed that in July 2026. Choosing
  # the successor is tracked as P059 in DECISIONS.md, and the heap watchdog
  # (src/heap-watchdog.ts) warns at 70% so the runway is observed, not guessed.
  # If you raise this, raise NODE_OPTIONS above with it or nothing changes.
  memory = '1024mb'

app = 'atrib-log'
primary_region = 'iad'

[build]
  dockerfile = '../../services/log-node/Dockerfile'

[env]
  PORT = '3100'
  HOST = '0.0.0.0'
  ATRIB_LOG_PERSIST = '/data/entries.bin'
  # Fan out every successful submission to graph-node so the derived graph
  # stays in sync with the source-of-truth log. Fire-and-forget; failures
  # don't affect the submit response. Not a secret, just a URL.
  ATRIB_GRAPH_FANOUT_ENDPOINT = 'https://graph.atrib.dev/v1/ingest'

[[mounts]]
  source = 'atrib_log_data'
  destination = '/data'

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  # The persisted log is replayed into the in-memory Merkle tree at startup.
  # The production corpus no longer fits safely beside Node and Fly guest
  # overhead in 256 MB; 512 MB prevents OOM restart loops while the storage
  # engine remains memory-resident.
  memory = '512mb'

[checks]
  [checks.health]
    port = 3100
    type = 'http'
    interval = '15s'
    timeout = '2s'
    # grace_period MUST exceed boot-to-listening. Measured 2026-07-29 from the
    # Fly logs: "Starting init" 08:57:02 -> "atrib-log listening" 08:57:07, so
    # 5 seconds against a 5 second grace, i.e. no margin at all. Any slower
    # boot fails the check on a service that is merely starting.
    #
    # It also grows: as the comment on [[vm]] memory below says, the persisted
    # log is replayed into the in-memory Merkle tree at startup, so this scales
    # with tree_size (~115k entries on the measurement date, replaying at
    # roughly 23k entries/sec).
    #
    # 45s is ~9x the measured boot and covers on the order of a million entries
    # before it needs revisiting. Fly clamps this field at 60s (`flyctl config
    # validate` warns "this will be lowered to 1 minute"), so 60s is the hard
    # ceiling, not a value to reach for casually: past it the only fix is
    # making startup cheaper.
    grace_period = '45s'
    method = 'GET'
    # /v1/pubkey always returns 200 (even with an empty tree); /v1/checkpoint
    # returns 404 until the first entry lands. With persistence in place a
    # restart now restores the tree, so /v1/checkpoint would also work, but
    # /v1/pubkey is robust against the cold-start case too.
    path = '/v1/pubkey'

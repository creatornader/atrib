app = 'atrib-directory'
primary_region = 'iad'

[build]
  dockerfile = '../../services/directory-node/Dockerfile'

[env]
  PORT = '3300'
  HOST = '0.0.0.0'
  ATRIB_DIRECTORY_ORIGIN = 'directory.atrib.dev/v6'
  ATRIB_LOG_ENDPOINT = 'https://log.atrib.dev/v1'
  # Write-ahead JSONL of validated publishes. On startup, every line is
  # replayed into a fresh in-memory AKD; replay is deterministic, so epoch
  # numbers and root hashes match the live sequence. Without this, restart
  # loses all prior claims. The service also fsyncs prepared and committed anchor
  # entries to /data/publishes.jsonl.anchors.jsonl so the anchor chain head
  # and signed bodies survive restart.
  ATRIB_DIRECTORY_PERSIST = '/data/publishes.jsonl'

[[mounts]]
  source = 'atrib_directory_data'
  destination = '/data'

[http_service]
  internal_port = 3300
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[checks]
  [checks.health]
    port = 3300
    type = 'http'
    method = 'GET'
    path = '/v6/anchor'
    interval = '30s'
    timeout = '5s'
    # Left at 15s: measured 2026-07-29, "Starting init" 08:56:59 -> "directory-node
    # listening" 08:57:02, so 3 seconds with 5x margin. Unlike log-node and
    # archive-node, which were sitting at zero and one second of margin and were
    # raised in the same change, this one has room.
    #
    # It is not fixed forever. Startup replays persisted claims into a fresh
    # in-memory AKD ("replayed 20 persisted claims"), so re-measure if claim
    # volume grows by an order of magnitude. Fly clamps this field at 60s.
    grace_period = '15s'
